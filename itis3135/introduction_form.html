<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Natalia Dudley's Nice Dragonfly | ITIS3135 | Introduction Form</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/default.css">
        <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
        <link rel="manifest" href="site.webmanifest">
        <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
        <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script> 
    </head>
    <body>
        <div data-include="components/header.html"></div>
        <main>
            <h2>Introduction Form</h2>
            <h3>Please Submit The Form Below</h3>
            <form>
                <fieldset>
                <legend>Personal Information</legend>
                <label for="firstName">First Name:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="firstName" value="Natalia" placeholder="Natalia" required>

                <label for="middleName">Middle Name:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="middleName" value="Lisette" placeholder="Lisette">

                <label for="nickname">Nickname:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="nickname" value="Didi" placeholder="Didi">

                <label for="lastName">Last Name:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="lastName" value="Dudley" placeholder="Dudley" required>

                <label for="acknowledgment">Acknowledgment Statement:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="acknowledgment" required value="I understand that this is a public document, and I won’t put anything here I wouldn’t want anyone to see." placeholder="I understand that this is a public document, and I won’t put anything here I wouldn’t want anyone to see.">

                <label for="acknowledgmentDate">Acknowledgment Date:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="acknowledgmentDate" required value="2026-08-24" placeholder="2026-08-24">
                </fieldset>
                
                <fieldset>
                <legend>Mascot and Title</legend>
                <label for="adjectives">Mascot Adjective:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="adjectives" value="Nice" placeholder="Nice" required>

                <label for="animal">Mascot Animal:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="animal" value="Dragonfly" placeholder="Dragonfly" required>

                <label for="prettyNameDivider">Divider:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="prettyNameDivider" value="|" placeholder="|" required>
                </fieldset>

                <fieldset>
                <legend>Picture</legend>
                <label for="img">Picture:</label>
                <!-- id is used to identify what the input is for -->
                <input type="file" id="img" required>
                <button type="button" onclick="loadImage()">Click here to load</button>
                <!-- this div is where the image shows up after loaded -->
                <div id="loadImage"></div>

                <label for="pictureAlt">Picture Alt Text:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="pictureAlt" value="portrait of myself" placeholder="portrait of myself" required>

                <label for="caption">Picture Caption:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="caption" value="Wearing my Duck shirt" placeholder="Describe the image" required>
                </fieldset>

                <fieldset>
                <legend>Background</legend>
                <label for="statement">Personal Statement:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="statement" value="Hello! My name is Natalia Dudley. I’m 20 years old and in my third year at UNC Charlotte. I’m a computer science major with a concentration in software engineering." placeholder="Hello! My name is..." required>
                <label for="personalBackground">Personal Background:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="personalBackground" required value="I grew up in a town called Wheaton in the Chicago suburbs. My family moved to Holly Springs, North Carolina, in 2021, when I was in my sophomore year of high school. I’ll never get used to the weather here!" placeholder="I'm from...">
                <label for="professionalBackground">Professional Background:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="professionalBackground" required value="I’m a tutor here at UNC Charlotte." placeholder="I worked as a...">
                <label for="academicBackground">Academic Background:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="academicBackground" required value="Computer Science, Spring 2028" placeholder="Computer Science, Spring 2028">
                </fieldset>
                <fieldset>
                <legend>Work Environment</legend>
                <label for="primaryWorkComputer">Primary Work Computer:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="primaryWorkComputer" required value="Acer Swift SFG16-72T with Microsoft Windows 11 Home" placeholder="Laptop, Desktop, Tablet, etc.">
                <label for="primaryWorkLocation">Primary Work Location:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="primaryWorkLocation" required value="Popp Martin Student Union" placeholder="Home, Library, Café, etc.">
                <label for="alternateComputerLocation">Alternate Computer & Location:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="alternateComputerLocation" required value="I can borrow a computer from the library and work in the library or at home" placeholder="I have access to another computer at...">"
                </fieldset>

                <fieldset>
                <legend>Courses I'm Taking and Why:</legend>
                <!-- Each course is within a div -->
                <div id="course1">
                <p>Course 1:</p>
                <label for="department">Course Department:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="department" required value="ITIS" placeholder="ITIS">
                <label for="courseNumber">Course Number:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="courseNumber" required value="3135" placeholder="3135">
                <label for="courseTitle">Course Name:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="courseTitle" required value="Front-End Web Application Development" placeholder="Front-End Web Application Development">
                <label for="reasonForTaking">Reason:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="reasonForTaking" required value="Required for my concentration" placeholder="Because...">
                
                <button type="button" id="delCourse" onclick="deleteCourse(this)">Delete Course</button>
                </div>

                <!-- Each course is within a div -->
                <div id="course2"></div>
                <!-- Each course is within a div -->
                <div id="course3"></div>
                <!-- Each course is within a div -->
                <div id="course4"></div>
                <!-- Each course is within a div -->
                <div id="course5"></div>
                <!-- Each course is within a div -->
                <div id="course6"></div>

                <button type="button" onclick="addCourse()">Add Course</button>
                </fieldset>

                <fieldset>
                <legend>Fun Stuff</legend>
                <label for="quote">Quote:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="quote" required value="Lose yourself to dance!" placeholder="Something inspirational or funny">

                <label for="quoteAuthor">Quote Author:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="quoteAuthor" required value="Pharrell Williams" placeholder="Firstname Lastname">

                <label for="funnyItem">Funny Thing:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="funnyItem" value="I love stickers" placeholder="I love...">

                <label for="somethingToShare">Something I'd like to share:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="somethingToShare" value="I have ADHD but it's mostly handled with medication" placeholder="Something about me...">
                </fieldset>

                <fieldset>
                <legend>Links</legend>
                <label for="clt-web">CLT Web:</label>
                <!-- id is used to identify what the input is for -->
                <input type="url" id="clt-web" value="https://webpages.charlotte.edu/ndudley2/" placeholder="https://webpages.charlotte.edu/">

                <label for="github-web">GitHub.io:</label>
                <!-- id is used to identify what the input is for -->
                <input type="url" id="github-web" value="https://ndudley2.github.io/" placeholder="https://github.io/">

                <label for="github">GitHub:</label>
                <!-- id is used to identify what the input is for -->
                <input type="url" id="github" value="https://github.com/ndudley2" placeholder="https://github.com/">

                <label for="fcc">freeCodeCamp:</label>
                <!-- id is used to identify what the input is for -->
                <input type="url" id="fcc" value="https://www.freecodecamp.org/ndudley2" placeholder="https://www.freecodecamp.org/">

                <label for="codecademy">Codecademy:</label>
                <!-- id is used to identify what the input is for -->
                <input type="url" id="codecademy" value="https://www.codecademy.com/profiles/ndudley2" placeholder="https://www.codecademy.com/">

                <label for="linkedin">LinkedIn:</label>
                <!-- id is used to identify what the input is for -->
                <input type="url" id="linkedin" value="https://www.linkedin.com/in/natalia-dudley-41b9312bb/" placeholder="https://www.linkedin.com/">
                </fieldset>
                
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
                <!-- id identifies the clear button -->
                <button type="button" id="clear">Clear</button>
                <br>
                <!-- id identifies the HTML, XML, and JSON buttons -->
                <button type="button" id="generateHtml">Generate HTML</button>
                <button type="button" id="generateXml">Generate XML</button>
                <button type="button" id="generateJson">Generate JSON</button>
            </form>
            <section id="generatedOutputSection" hidden>
                <h3 id="outputHeading">Generated Output</h3>
                <pre id="generatedOutput" aria-labelledby="outputHeading" aria-live="polite"></pre>
            </section>
        </main>
        <div data-include="components/footer.html"></div>
        <script src="scripts/HTMLInclude.min.js"></script>
        <script src="scripts/introduction.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Natalia Dudley's Nice Dragonfly | ITIS3135 | Introduction Form</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/default.css">
        <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
        <link rel="manifest" href="site.webmanifest">
        <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
        <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script> 
    </head>
    <body>
        <div data-include="components/header.html"></div>
        <main>
            <h2>Introduction Form</h2>
            <h3>Please Submit The Form Below</h3>
            <form>
                <label for="firstName">First Name:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="firstName" value="Natalia" required>

                <label for="middleName">Middle Name:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="middleName" value="Lisette">

                <label for="nickname">Nickname:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="nickname" value="Didi">

                <label for="lastName">Last Name:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="lastName" value="Dudley" required>

                <label for="acknowledgment">Acknowledgment Statement:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="acknowledgment" required value="I understand that this is a public document, and I won’t put anything here I wouldn’t want anyone to see.">

                <label for="acknowledgmentDate">Acknowledgment Date:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="acknowledgmentDate" required value="2026-08-24">

                <label for="adjectives">Mascot Adjective:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="adjectives" value="Nice" required>

                <label for="animal">Mascot Animal:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="animal" value="Dragonfly" required>

                <label for="prettyNameDivider">Divider:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="prettyNameDivider" value="|" required>

                <label for="img">Picture:</label>
                <!-- id is used to identify what the input is for -->
                <input type="file" id="img" required>
                <button type="button" onclick="loadImage()">Click here to load</button>
                <!-- this div is where the image shows up after loaded -->
                <div id="loadImage"></div>

                <label for="pictureAlt">Picture Alt Text:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="pictureAlt" value="portrait of myself" required>

                <label for="caption">Picture Caption:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="caption" value="Wearing my Duck shirt" required>

                <label for="statement">Personal Statement:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="statement" value="Hello! My name is Natalia Dudley. I’m 20 years old and in my third year at UNC Charlotte. I’m a computer science major with a concentration in software engineering." required>

                <label for="personalBackground">Personal Background:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="personalBackground" required value="I grew up in a town called Wheaton in the Chicago suburbs. My family moved to Holly Springs, North Carolina, in 2021, when I was in my sophomore year of high school. I’ll never get used to the weather here!">
                <label for="professionalBackground">Professional Background:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="professionalBackground" required value="I’m a tutor here at UNC Charlotte.">
                <label for="academicBackground">Academic Background:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="academicBackground" required value="Computer Science, Spring 2028">
                <label for="primaryWorkComputer">Primary Work Computer:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="primaryWorkComputer" required value="Acer Swift SFG16-72T with Microsoft Windows 11 Home">
                <label for="primaryWorkLocation">Primary Work Location:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="primaryWorkLocation" required value="Popp Martin Student Union">
                <label for="alternateComputerLocation">Alternate Computer & Location:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="alternateComputerLocation" required value="I can borrow a computer from the library and work in the library or at home">

                <fieldset>
                <legend>Courses I'm Taking and Why:</legend>

                <p>Course 1:</p>
                <label for="department">Course Department:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="department" required value="ITIS">
                <label for="courseNumber">Course Number:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="courseNumber" required value="3135">
                <label for="courseTitle">Course Name:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="courseTitle" required value="Front-End Web Application Development">
                <label for="reasonForTaking">Reason:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="reasonForTaking" required value="Required for my concentration">

                <button type="button" onclick="addCourse()"></button>
                </fieldset>


                <label for="quote">Quote:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="quote" required value="Lose yourself to dance!">

                <label for="quoteAuthor">Quote Author:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="quoteAuthor" required value="Pharrell Williams">

                <label for="funnyItem">Funny Thing:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="funnyItem">

                <label for="somethingToShare">Something I'd like to share:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="somethingToShare">

                <label for="clt-web">CLT Web:</label>
                <!-- id is used to identify what the input is for -->
                <input type="url" id="clt-web" value="https://webpages.charlotte.edu/ndudley2/">

                <label for="github-web">GitHub.io:</label>
                <!-- id is used to identify what the input is for -->
                <input type="url" id="github-web" value="https://ndudley2.github.io/">

                <label for="github">GitHub:</label>
                <!-- id is used to identify what the input is for -->
                <input type="url" id="github" value="https://github.com/ndudley2">

                <label for="fcc">freeCodeCamp:</label>
                <!-- id is used to identify what the input is for -->
                <input type="url" id="fcc" value="https://www.freecodecamp.org/ndudley2">

                <label for="codecademy">Codecademy:</label>
                <!-- id is used to identify what the input is for -->
                <input type="url" id="codecademy" value="https://www.codecademy.com/profiles/ndudley2">

                <label for="linkedin">LinkedIn:</label>
                <!-- id is used to identify what the input is for -->
                <input type="url" id="linkedin" value="https://www.linkedin.com/in/natalia-dudley-41b9312bb/">
                
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
                <!-- id identifies the clear button -->
                <button type="button" id="clear">Clear</button>
            </form>
        </main>
        <div data-include="components/footer.html"></div>
        <script src="scripts/HTMLInclude.min.js"></script>
        <script src="scripts/introduction.js"></script>
    </body>
</html>

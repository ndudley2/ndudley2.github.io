<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Natalia Dudley's Nice Dragonfly | ITIS3135 | Cards</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/default.css">
        <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
        <link rel="manifest" href="/site.webmanifest">
        <style>
            #playing-cards {
                display: flex;
                gap: 20px;
                flex-wrap: wrap;
                justify-content: space-around;
            }
            .card {
                display: flex;
                justify-content: space-between;
                width: 30%;
                height: 400px;
                background-color: #8BC9FF;
                color: #3d4558;
                font-family: 'Trebuchet MS', sans-serif;
                font-size: 2.5em;
                padding: 5px;
                border-color: #b6ff8b;
                border-width: 5px;
                border-radius: 10px;
            }
            .left {
                display: flex;
                align-self: flex-start;
            }
            .middle {
                display: flex;
                align-self: center;
                flex-direction: column;
                width: 50%;
            }
            .right {
                display: flex;
                align-self: flex-end;
            }
            .card img {
                width: 100%;
            }
        </style>
        <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
        <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script> 
    </head>
    <body>
        <div data-include="components/header.html"></div>
        <main>
            <h2>Cards</h2>
            <div class="card">
                <div class="left">1</div>
                <div class="middle"><img src="images/dragonfly_sketch.png" alt="a sketch of a dragonfly"></div>
                <div class="right">1</div>
            </div>
            <div class="card">
                <div class="left">2</div>
                <div class="middle"><img src="images/dragonfly_sketch.png" alt="a sketch of a dragonfly"><img src="images/dragonfly_sketch.png" alt="a sketch of a dragonfly"></div>
                <div class="right">2</div>
            </div>
            <div class="card">
                <div class="left">3</div>
                <div class="middle"><img src="images/dragonfly_sketch.png" alt="a sketch of a dragonfly"><img src="images/dragonfly_sketch.png" alt="a sketch of a dragonfly"><img src="images/dragonfly_sketch.png" alt="a sketch of a dragonfly"></div>
                <div class="right">3</div>
            </div>
            <div class="card">
                <div class="left">Lotus</div>
                <div class="middle"><img src="images/lotus-sketch.svg" alt="a drawing of a lotus"></div>
                <div class="right">Lotus</div>
            </div>
            <div class="card">
                <div class="left">Duck</div>
                <div class="middle"><img src="images/duck-sketch.svg" alt="a sketch of a duck"></div>
                <div class="right">Duck</div>
            </div>
            <div class="card">
                <div class="left">Beetle</div>
                <div class="middle"><img src="images/beetle_sketch.svg" alt="a sketch of a beetle"></div>
                <div class="right">Beetle</div>
            </div>
        </main>
        <div data-include="components/footer.html"></div>
        <script src="scripts/HTMLInclude.min.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Natalia Dudley's Nice Dragonfly | ITIS3135 | Inventory</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/default.css">
        <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
        <link rel="manifest" href="/site.webmanifest">
        <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
        <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script> 
    </head>
    <body>
        <div data-include="components/header.html"></div>
        <main>
            <h2>Inventory</h2>
            <p>This is my inventory page</p>
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Rate</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="read">
                        <td>2001: A Space Odyssey</td>
                        <td>Arthur C. Clarke</td>
                        <td>Science Fiction</td>
                        <td><span class="status">Read</span></td>
                        <td>
                            <span class="rate five">
                                <p>⭐⭐⭐⭐⭐</p>
                            </span>
                        </td>
                    </tr>
                    <tr class="to-read">
                        <td>The Great Gatsby</td>
                        <td>F. Scott Fitzgerald</td>
                        <td>Fiction</td>
                        <td><span class="status">To Read</span></td>
                        <td>
                            <span class="rate none">
                                <p>No rating yet...</p>
                            </span>
                        </td>
                    </tr>
                    <tr class="in-progress">
                        <td>Battle Angel Alita Vol. 1</td>
                        <td>Yukito Kishiro</td>
                        <td>Manga</td>
                        <td><span class="status">In Progress</span></td>
                        <td>
                            <span class="rate">
                                <p>⭐⭐⭐⭐</p>
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>
        <div data-include="components/footer.html"></div>
        <script src="scripts/HTMLInclude.min.js"></script>
    </body>
</html>

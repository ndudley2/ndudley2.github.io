<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Natalia Dudley's Nice Dragonfly | ITIS3135 | Survey</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/default.css">
        <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
        <link rel="manifest" href="/site.webmanifest">
        <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
        <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script> 
    </head>
    <body>
        <div data-include="components/header.html"></div>
        <main>
            <h2>Survey</h2>
            <p>This is my survey page</p>
            <form>
                <label for="name">Name:</label>
                <!-- id is used to identify what the input is for -->
                <input type="text" id="name" required placeholder="Johnny Appleseed">
                <label for="email">Email:</label>
                <!-- id is used to identify what the input is for -->
                <input type="email" id="email" placeholder="example@gmail.com" required>
                <label for="number">Age:</label>
                <!-- id is used to identify what the input is for -->
                <input type="number" id="number" min="3" max="120" placeholder="21">
                <!-- id is used to identify what the input is for -->
                <select id="dropdown">
                    <option>Freshman</option>
                    <option>Sophomore</option>
                    <option>Junior</option>
                    <option>Senior</option>
                </select>
                <label for="dropdown">What year are you?</label>
                <p>Favorite kind of donut?</p>
                <fieldset>                <!-- id is used to identify what the input is for -->
                    <input type="radio" id="glazed" value="glazed" name="donut">
                    <label for="glazed">Glazed</label>
                    <!-- id is used to identify what the input is for -->
                    <input type="radio" id="powdered" value="powdered" name="donut">
                    <label for="powdered">Powdered</label>
                    <!-- id is used to identify what the input is for -->
                    <input type="radio" id="chocolate" value="chocolate" name="donut">
                    <label for="chocolate">Chocolate</label>
                    <!-- id is used to identify what the input is for -->
                    <input type="radio" id="cream" value="cream" name="donut">
                    <label for="cream">Cream-filled</label>
                    <!-- id is used to identify what the input is for -->
                    <input type="radio" id="jam" value="jam" name="donut">
                    <label for="jam">Jam-filled</label>
                    <!-- id is used to identify what the input is for -->
                    <input type="radio" id="frosted" value="frosted" name="donut">
                    <label for="frosted">Frosted</label>
                </fieldset>
                <p>Donut Frosting:</p>
                <!-- id is used to identify what the input is for -->
                <input type="checkbox" id="frosting1" value="chocolate">
                <label for="frosting1">Chocolate Frosting</label>
                <!-- id is used to identify what the input is for -->
                <input type="checkbox" id="frosting2" value="strawberry">
                <label for="frosting2">Strawberry Frosting</label>
                <!-- id is used to identify what the input is for -->
                <input type="checkbox" id="frosting3" value="vanilla">
                <label for="frosting3">Vanilla Frosting</label>
                <!-- id is used to identify what the input is for -->
                <input type="checkbox" id="frosting4" value="maple">
                <label for="frosting4">Maple Frosting</label>
                <!-- id is used to identify what the input is for -->
                <input type="checkbox" id="frosting5" value="glazed">
                <label for="frosting5">Glazed</label>
                <p>Donut Toppings:</p>
                <!-- id is used to identify what the input is for -->
                <input type="checkbox" id="topping1" value="sprinkles2">
                <label for="topping1">Rainbow Sprinkles</label>
                <!-- id is used to identify what the input is for -->
                <input type="checkbox" id="topping2" value="oreo">
                <label for="topping2">Oreo Crumble</label>
                <!-- id is used to identify what the input is for -->
                <input type="checkbox" id="topping3" value="sprinkles2">
                <label for="topping3">Chocolate Sprinkles</label>
                <br>
                <label for="textarea">Other details:</label>
                <!-- id is used to identify what the input is for -->
                <textarea id="textarea" rows="5" cols="40" placeholder="I like..."></textarea>
                <button type="submit" id="submit">Submit</button>
            </form>
        </main>
        <div data-include="components/footer.html"></div>
        <script src="scripts/HTMLInclude.min.js"></script>
    </body>
</html>

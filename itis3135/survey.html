<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Natalia Dudley's Nice Dragonfly | ITIS3135 | Survey</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/default.css">
        <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
        <link rel="manifest" href="/site.webmanifest">
        <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
        <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script> 
    </head>
    <body>
        <div data-include="components/header.html"></div>
        <main>
            <h2>Survey</h2>
            <p>This is my survey page</p>
            <form id="survey-form">
                <label id="name-label" for="#name">Name:</label>
                <input type="text" id="name" required placeholder="Johnny Appleseed"></input>
                <label id="email-label" for="#email">Email:</label>
                <input type="email" id="email" placeholder="example@gmail.com" required></input>
                <label id="number-label" for="#number">Age:</label>
                <input type="number" id="number" min="3" max="120" placeholder="21"></input>
                <label id="dropdown-label" for="dropdown">What year are you?</label>
                <select id="dropdown">
                    <option>Freshman</option>
                    <option>Sophomore</option>
                    <option>Junior</option>
                    <option>Senior</option>
                </select>
                <p>Do you like waffles?</p>
                <input type="radio" id="yes" value="yes" name="yesno"></input>
                <label id="yes-label" for="yes">Yes</label>
                <input type="radio" id="no" name="yesno" value="no"></input>
                <label id="yes-label" for="no">No</label>
                <p>Pizza toppings:</p>
                <input type="checkbox" value="pepperoni">Pepperoni</input>
                <input type="checkbox" value="mushrooms">Mushrooms</input>
                <input type="checkbox" value="olives">Olives</input>
                <p>Tell me a joke:</p>
                <textarea rows="5" cols="40" placeholder="Did you hear about the child psychic who escaped from jail? She's a small medium at large..."></textarea>
                <button type="submit" id="submit"></button>
            </form>
        </main>
        <div data-include="components/footer.html"></div>
        <script src="scripts/HTMLInclude.min.js"></script>
    </body>
</html>

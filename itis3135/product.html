<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Natalia Dudley's Nice Dragonfly | ITIS3135 | Product</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/default.css">
        <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
        <link rel="manifest" href="site.webmanifest">
        <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
        <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script> 
    </head>
    <body>
        <div data-include="components/header.html"></div>
        <main>
            <h2>Product</h2>
            <nav>
                <p>
                <a href="#about">About</a> |
                <a href="#feedback">Feedback</a> |
                <a href="#email-form">Sign Up</a>
                </p>
            </nav>
            <hr>
            <section id="about">
                <h3>Donuts!</h3>
                <p>We sell all kinds of donuts:</p>
                <ul>
                    <li>Glazed</li>
                    <li>Chocolate</li>
                    <li>Frosted + sprinkles</li>
                    <li>Cream-filled</li>
                    <li>... and more!</li>
                </ul>
                <figure>
                    <img src="images/donuts-product.jpg" alt="a stack of donuts with a red heart-shaped cake topper">
                    <figcaption>Don't these look amazing?</figcaption>
                </figure>
                <p>You gotta buy some.</p>
            </section>
            <hr>
            <section id="feedback">
                <h3>Feedback</h3>
                <label for="textarea">Tell us how you feel about donuts:</label>
                <!-- id is used to identify what the input is for -->
                <textarea id="textarea" rows="5" cols="40" placeholder="I like..."></textarea>
                <!-- id is used to identify what the input is for -->
                <button type="submit" id="submit-feedback">Submit</button>
            </section>
            <hr>
            <section id="email-form">
                <h3>Stay Updated</h3>
                <p>Join our email list to recieve special donut news.</p>
                <form>
                    <label for="email">Email:</label>
                    <!-- id is used to identify what the input is for -->
                    <input id="email" name ="email" type="email" placeholder="email@website.com">
                    <!-- id is used to identify what the input is for -->
                    <button id="submit-email" type="submit">Submit</button>
                </form>
            </section>
        </main>
        <div data-include="components/footer.html"></div>
        <script src="scripts/HTMLInclude.min.js"></script>
    </body>
</html>
